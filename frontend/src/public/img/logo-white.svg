<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <!-- Gradiente naranja del diamante -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D94F10;stop-opacity:1" />
    </linearGradient>

    <!-- Sombra del diamante -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(217,79,16,0.35)" />
    </filter>

    <!-- Clip para el diamante -->
    <clipPath id="diamondClip">
      <rect x="10" y="10" width="60" height="60" rx="8" transform="rotate(45 40 40)" />
    </clipPath>
  </defs>

  <!-- ── Icono diamante ── -->
  <g transform="translate(0, 0)">

    <!-- Sombra suave detrás -->
    <rect x="14" y="14" width="52" height="52" rx="10"
      transform="rotate(45 40 40)"
      fill="rgba(217,79,16,0.15)"
      filter="url(#shadow)" />

    <!-- Rombo principal -->
    <rect x="13" y="13" width="54" height="54" rx="10"
      transform="rotate(45 40 40)"
      fill="url(#diamondGrad)" />

    <!-- Borde interior sutil -->
    <rect x="16" y="16" width="48" height="48" rx="8"
      transform="rotate(45 40 40)"
      fill="none"
      stroke="rgba(255,255,255,0.22)"
      stroke-width="1.5" />

    <!-- Reflejo de luz arriba-izquierda -->
    <rect x="18" y="18" width="26" height="26" rx="5"
      transform="rotate(45 40 40)"
      fill="rgba(255,255,255,0.08)" />

    <!-- Casa blanca -->
    <!-- Techo / triángulo -->
    <polygon
      points="40,18 56,30 24,30"
      fill="white"
      opacity="0.97" />

    <!-- Cuerpo de la casa -->
    <rect x="26" y="30" width="28" height="18" rx="1"
      fill="white" opacity="0.97" />

    <!-- Puerta -->
    <rect x="35" y="36" width="10" height="12" rx="1.5"
      fill="rgba(217,79,16,0.35)" />

    <!-- Ventana izquierda -->
    <rect x="29" y="33" width="5" height="5" rx="1"
      fill="rgba(217,79,16,0.25)" />

    <!-- Ventana derecha -->
    <rect x="46" y="33" width="5" height="5" rx="1"
      fill="rgba(217,79,16,0.25)" />

    <!-- Punto en la cima del techo -->
    <circle cx="40" cy="17" r="1.5" fill="rgba(255,255,255,0.6)" />
  </g>

  <!-- ── Texto "Condome" ── -->
  <g transform="translate(88, 0)">

    <!-- "Condo" en blanco -->
    <text
      x="0" y="50"
      font-family="'Playfair Display', Georgia, serif"
      font-size="38"
      font-weight="600"
      fill="#FFFFFF"
      letter-spacing="-0.5">Condo</text>

    <!-- "me" en naranja -->
    <text
      x="122" y="50"
      font-family="'Playfair Display', Georgia, serif"
      font-size="38"
      font-weight="600"
      fill="#D94F10"
      letter-spacing="-0.5">me</text>

    <!-- Tagline -->
    <text
      x="1" y="66"
      font-family="'DM Sans', system-ui, sans-serif"
      font-size="9"
      font-weight="500"
      fill="#F2ECE5"
      letter-spacing="3"
      opacity="0.8">GESTIÓN RESIDENCIAL</text>

    <!-- Línea decorativa bajo el tagline -->
    <line x1="1" y1="70" x2="80" y2="70"
      stroke="#D94F10" stroke-width="1.5"
      stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
